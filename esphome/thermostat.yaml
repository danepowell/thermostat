esphome:
  name: thermostat
  friendly_name: Thermostat
  includes:
    - button_layout.h

esp32:
  variant: ESP32C6
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret thermostat__encryption_key
ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Thermostat Fallback Hotspot
    password: !secret thermostat__ap_password
captive_portal:

# SPI for display (Waveshare Touch E-Paper HAT)
spi:
  clk_pin: GPIO19
  mosi_pin: GPIO18
  id: spi_1

# I2C for touch controller (Waveshare Touch E-Paper HAT)
i2c:
  sda: GPIO22
  scl: GPIO23
  scan: false
  id: bus_a

image:
  - platform: file
    type: BINARY
    file: "mdi:chevron-up"
    id: "plus"
  - platform: file
    type: BINARY
    file: "mdi:chevron-down"
    id: "minus"
  - platform: file
    type: BINARY
    file: "mdi:power"
    id: "off"
  - platform: file
    type: BINARY
    file: "mdi:radiator"
    id: "heat"
  - platform: file
    type: BINARY
    file: "mdi:snowflake"
    id: "cool"
  - platform: file
    type: BINARY
    file: "mdi:fan"
    id: "fan"
  - platform: file
    type: BINARY
    file: "mdi:arrow-right"
    id: "arrow"
  - platform: file
    type: BINARY
    file: "mdi:battery"
    id: "battery_high"
  - platform: file
    type: BINARY
    file: "mdi:battery-70"
    id: "battery_medium"
  - platform: file
    type: BINARY
    file: "mdi:battery-30"
    id: "battery_low"
  - platform: file
    type: BINARY
    file: "mdi:battery-off"
    id: "battery_none"

font:
  - file: "gfonts://Roboto"
    id: font_lg
    size: 32
  - file: "gfonts://Roboto"
    id: font_md
    size: 22

external_components:
  - source:
      type: git
      url: https://github.com/danepowell/esphome
      ref: d7f05a9801d8d536125cbd2572a86aaecf316916
    components: [ icnt86 ]
  - source:
      type: git
      url: https://github.com/danepowell/esphome
      ref: 14163ecde1aa4aa902bdaf3e60f4bb7eb6864ae1
    components: [ epaper_spi ]

# Use local variables so +/- feels responsive.
globals:
  - id: target_temp_local
    type: int
    initial_value: "72"
  - id: current_temp_local
    type: int
    initial_value: "72"
  - id: hvac_mode
    type: std::string
    initial_value: '"unknown"'

sensor:
  - platform: homeassistant
    id: hp_current_temp
    entity_id: climate.officeheatpump
    attribute: current_temperature
    on_value:
      then:
        - lambda: |-
            id(current_temp_local) = x;
        - component.update: display_waveshare_epaper_1

  - platform: homeassistant
    id: hp_target_temp
    entity_id: climate.officeheatpump
    attribute: temperature
    on_value:
      then:
        - lambda: |-
            id(target_temp_local) = x;
        - component.update: display_waveshare_epaper_1
  # Raw ADC reading from the battery voltage divider.
  - platform: adc
    id: adc_batt_raw
    pin: GPIO0
    attenuation: 12db
    update_interval: 5min
    internal: true
  # Convert raw ADC reading to battery voltage.
  - platform: copy
    source_id: adc_batt_raw
    id: battery_voltage
    name: "Battery Voltage"
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    filters:
      - multiply: 1.33 # NOTE: Calibrate this multiplier for your specific voltage divider.
  # Convert battery voltage to a percentage using a non-linear curve for LiPo batteries.
  - platform: copy
    source_id: battery_voltage
    id: battery_percent
    name: "Battery Level"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    filters:
      # This curve maps voltage to percentage. Adjust for your specific battery.
      - calibrate_linear:
          - 4.18 -> 100
          - 4.00 -> 85
          - 3.85 -> 60
          - 3.80 -> 50
          - 3.70 -> 25
          - 3.50 -> 5
          - 3.30 -> 0
      # Clamp values to the 0-100% range and apply a moving average to smooth out readings.
      - clamp:
          min_value: 0
          max_value: 100
      - sliding_window_moving_average:
          window_size: 4
          send_every: 1
    on_value_range:
      - below: 25.1
        then:
          # A near-zero voltage means no battery is attached (divider pulled to
          # ground) and we're running on USB, so don't sleep.
          - if:
              condition:
                lambda: 'return id(battery_voltage).state > 2.5;'
              then:
                - logger.log: "Battery critical, entering deep sleep."
                - deep_sleep.enter: battery_saver_sleep
              else:
                - logger.log: "No battery detected, staying awake on USB power."

text_sensor:
  - platform: homeassistant
    id: hp_state
    entity_id: climate.officeheatpump
    on_value:
      then:
        - lambda: |-
            id(hvac_mode) = x;
        - component.update: display_waveshare_epaper_1

script:
  - id: set_temp_script
    mode: restart
    then:
      - homeassistant.action:
          action: climate.set_temperature
          data:
            entity_id: climate.officeheatpump
            temperature: !lambda 'return id(target_temp_local);'
  - id: set_mode_script
    mode: restart
    then:
      - homeassistant.action:
          action: climate.set_hvac_mode
          data:
            entity_id: climate.officeheatpump
            hvac_mode: !lambda 'return id(hvac_mode);'

touchscreen:
  - platform: icnt86
    id: my_touch
    i2c_id: bus_a
    interrupt_pin: GPIO16
    reset_pin: GPIO21
    calibration:
      x_min: 0
      x_max: 296
      y_min: 0
      y_max: 128
    transform:
      mirror_x: true
      mirror_y: true
    on_touch:
      then:
        - lambda: |-
            auto inBtn = [](int tx, int ty, const Button& b) {
              return tx >= b.x && tx <= b.x + b.w && ty >= b.y && ty <= b.y + b.h;
            };

            ESP_LOGD("touch", "Touch event: x=%d y=%d", touch.x, touch.y);

            const int x = touch.x;
            const int y = touch.y;

            // Plus button
            if (inBtn(x, y, BTN_PLUS)) {
              id(target_temp_local) += 1;
              if (id(target_temp_local) > 79) id(target_temp_local) = 79;
              id(display_waveshare_epaper_1).update();
              id(set_temp_script).execute();
              return;
            }

            // Minus button
            if (inBtn(x, y, BTN_MINUS)) {
              id(target_temp_local) -= 1;
              if (id(target_temp_local) < 59) id(target_temp_local) = 59;
              id(display_waveshare_epaper_1).update();
              id(set_temp_script).execute();
              return;
            }

            // OFF
            if (inBtn(x, y, BTN_OFF)) {
              id(hvac_mode) = "off";
              id(display_waveshare_epaper_1).update();
              id(set_mode_script).execute();
              return;
            }

            // HEAT
            if (inBtn(x, y, BTN_HEAT)) {
              id(hvac_mode) = "heat";
              id(display_waveshare_epaper_1).update();
              id(set_mode_script).execute();
              return;
            }

            // COOL
            if (inBtn(x, y, BTN_COOL)) {
              id(hvac_mode) = "cool";
              id(display_waveshare_epaper_1).update();
              id(set_mode_script).execute();
              return;
            }

            // FAN
            if (inBtn(x, y, BTN_FAN)) {
              id(hvac_mode) = "fan_only";
              id(display_waveshare_epaper_1).update();
              id(set_mode_script).execute();
              return;
            }
display:
  - platform: epaper_spi
    spi_id: spi_1
    model: WAVESHARE-2.9IN-V2
    cs_pin: GPIO20
    dc_pin: GPIO17
    id: display_waveshare_epaper_1
    reset_pin: GPIO2
    update_interval: never
    rotation: 270
    busy_pin: GPIO1
    full_update_every: 30
    lambda: |-
      // Header
      it.printf(8, 6, id(font_md), Color::BLACK, "Office Heat Pump");
      const float batt = id(battery_percent).state;
      const float batt_v = id(battery_voltage).state;
      auto batt_icon = id(battery_low);
      // A near-zero voltage means no battery is attached (divider pulled to ground).
      if (!isnan(batt_v) && batt_v <= 2.5f) {
        batt_icon = id(battery_none);
      } else if (!isnan(batt)) {
        if (batt > 90.0f) batt_icon = id(battery_high);
        else if (batt > 50.0f) batt_icon = id(battery_medium);
      }
      it.image(210, 6, batt_icon, COLOR_OFF, COLOR_ON);

      // Temps
      if (!isnan(id(current_temp_local))) it.printf(8, 34, id(font_lg), Color::BLACK, "%d°", id(current_temp_local));
      else it.printf(8, 34, id(font_lg), Color::BLACK, "--");

      it.image(58, 40, id(arrow), COLOR_OFF, COLOR_ON);
      it.printf(86, 34, id(font_lg), Color::BLACK, "%d°", id(target_temp_local));

      // Touch buttons for 296x128
      it.rectangle(BTN_PLUS.x,  BTN_PLUS.y,  BTN_PLUS.w,  BTN_PLUS.h, Color::BLACK);
      it.rectangle(BTN_MINUS.x, BTN_MINUS.y, BTN_MINUS.w, BTN_MINUS.h, Color::BLACK);

      const bool is_off  = id(hvac_mode) == "off";
      const bool is_heat = id(hvac_mode) == "heat";
      const bool is_cool = id(hvac_mode) == "cool";
      const bool is_fan  = id(hvac_mode) == "fan_only";

      // OFF button
      if (is_off) it.filled_rectangle(BTN_OFF.x, BTN_OFF.y, BTN_OFF.w, BTN_OFF.h, Color::BLACK);
      else        it.rectangle(BTN_OFF.x, BTN_OFF.y, BTN_OFF.w, BTN_OFF.h, Color::BLACK);

      // HEAT button
      if (is_heat) it.filled_rectangle(BTN_HEAT.x, BTN_HEAT.y, BTN_HEAT.w, BTN_HEAT.h, Color::BLACK);
      else         it.rectangle(BTN_HEAT.x, BTN_HEAT.y, BTN_HEAT.w, BTN_HEAT.h, Color::BLACK);

      // COOL button
      if (is_cool) it.filled_rectangle(BTN_COOL.x, BTN_COOL.y, BTN_COOL.w, BTN_COOL.h, Color::BLACK);
      else         it.rectangle(BTN_COOL.x, BTN_COOL.y, BTN_COOL.w, BTN_COOL.h, Color::BLACK);

      // FAN button
      if (is_fan) it.filled_rectangle(BTN_FAN.x, BTN_FAN.y, BTN_FAN.w, BTN_FAN.h, Color::BLACK);
      else        it.rectangle(BTN_FAN.x, BTN_FAN.y, BTN_FAN.w, BTN_FAN.h, Color::BLACK);

      // Icons
      it.image(BTN_PLUS.x + 18,  BTN_PLUS.y + 24, id(plus), COLOR_OFF, COLOR_ON);
      it.image(BTN_MINUS.x + 18, BTN_MINUS.y + 24, id(minus), COLOR_OFF, COLOR_ON);

      if (is_off)  it.image(BTN_OFF.x + 16,  BTN_OFF.y + 14,  id(off));
      else         it.image(BTN_OFF.x + 16,  BTN_OFF.y + 14,  id(off), COLOR_OFF, COLOR_ON);

      if (is_heat) it.image(BTN_HEAT.x + 16, BTN_HEAT.y + 14, id(heat));
      else         it.image(BTN_HEAT.x + 16, BTN_HEAT.y + 14, id(heat), COLOR_OFF, COLOR_ON);

      if (is_cool) it.image(BTN_COOL.x + 16, BTN_COOL.y + 14, id(cool));
      else         it.image(BTN_COOL.x + 16, BTN_COOL.y + 14, id(cool), COLOR_OFF, COLOR_ON);

      if (is_fan)  it.image(BTN_FAN.x + 16,  BTN_FAN.y + 14,  id(fan));
      else         it.image(BTN_FAN.x + 16,  BTN_FAN.y + 14,  id(fan), COLOR_OFF, COLOR_ON);
deep_sleep:
  id: battery_saver_sleep
  sleep_duration: 30min
